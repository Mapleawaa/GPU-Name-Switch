name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish (自包含 · 带运行时)
        run: >
          dotnet publish -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish/full

      - name: Publish (框架依赖 · 不带运行时)
        run: >
          dotnet publish -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish/lite

      - name: Strip junk
        run: |
          Remove-Item -Path publish\full\*.pdb  -Force -ErrorAction SilentlyContinue
          Remove-Item -Path publish\full\*.xml  -Force -ErrorAction SilentlyContinue
          Remove-Item -Path publish\lite\*.pdb -Force -ErrorAction SilentlyContinue
          Remove-Item -Path publish\lite\*.xml -Force -ErrorAction SilentlyContinue

      - name: Upload (full)
        uses: actions/upload-artifact@v4
        with:
          name: GpuSpoofer_full
          path: publish/full/

      - name: Upload (lite)
        uses: actions/upload-artifact@v4
        with:
          name: GpuSpoofer_lite
          path: publish/lite/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download (full)
        uses: actions/download-artifact@v4
        with:
          name: GpuSpoofer_full
          path: full

      - name: Download (lite)
        uses: actions/download-artifact@v4
        with:
          name: GpuSpoofer_lite
          path: lite

      - name: Zip (full)
        run: cd full && zip -r ../GpuSpoofer_full.zip .

      - name: Zip (lite)
        run: cd lite && zip -r ../GpuSpoofer_lite.zip .

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 下载

            | 版本 | 文件 | 大小 | 适用场景 |
            |------|------|------|---------|
            | **自包含** | `GpuSpoofer_full.zip` | ~35 MB | 懒得装运行时的用户，下载解压即用 |
            | **框架依赖** | `GpuSpoofer_lite.zip` | ~200 KB | 已安装 .NET 10 运行时的用户 |

            > 经常打游戏的电脑大概率已有 .NET 运行时（很多游戏依赖它），选 Lite 版即可。
            > 如果不确定，直接下载 Full 版，解压后以管理员身份运行 `GpuSpoofer.exe`。

            ## 验证

            ```
            GpuSpoofer_full.zip  SHA256: ${{ hashFiles('GpuSpoofer_full.zip') }}
            GpuSpoofer_lite.zip  SHA256: ${{ hashFiles('GpuSpoofer_lite.zip') }}
            ```
          files: |
            GpuSpoofer_full.zip
            GpuSpoofer_lite.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
